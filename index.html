
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Video Zone BD</title>
<style>
body {
  margin: 0;
  background: #101522;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 20px;
  text-align: center;
  background: #192438;
}
.card {
  margin: 20px;
  padding: 15px;
  background: #202d42;
  border-radius: 12px;
}
.thumbnail {
  height: 170px;
  background: #34445d;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 45px;
}
button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border: 0;
  border-radius: 8px;
  background: #13b981;
  color: white;
  font-weight: bold;
}
#unlock { display: none; }
</style>
</head>
<body>
<header>
  <h2>FREE VIDEO ZONE BD</h2>
  <p>Watch • Unlock • Enjoy</p>
</header>

<div class="card">
  <div class="thumbnail">▶️</div>
  <h3>Demo Video 01</h3>
  <p>Watch advertisements to unlock.</p>
  <button onclick="startAds()">WATCH VIDEO</button>
  <p id="status">0 / 3 ads completed</p>
  <button id="unlock" onclick="openChannel()">
    UNLOCK VIDEO
  </button>
</div>

<script>
let completed = 0;

function startAds() {
  if (completed >= 3) return;
  completed++;
  document.getElementById("status").innerText =
    completed + " / 3 ads completed (TEST MODE)";

  if (completed === 3) {
    document.getElementById("unlock").style.display = "block";
  }
}

function openChannel() {
  window.location.href =
    "https://t.me/FreeEarningZoneBD01";
}
</script>
</body>
</html>
